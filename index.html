<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZT Tools</title>
<style>
/* Global */
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:'Roboto',sans-serif;
  background:url("https://i.ibb.co/791tz0h/IMG-20250925-WA0413.jpg") no-repeat center center scroll;
  background-size:cover;
  color:#fff;
  overflow-x:hidden;
}
body{display:flex;flex-direction:column;min-height:100vh;}

/* Header */
header{
  width:100%;
  padding:14px;
  background:rgba(0,0,0,0.6);
  text-align:center;
  font-size:20px;
  font-weight:700;
  color:silver;
  border-bottom:1px solid rgba(192,192,192,0.4);
  position:fixed;
  top:0;
  left:0;
  z-index:1000;
}

/* Container */
.container{
  flex:1;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:70px;
  margin-bottom:80px;
}

/* Glass box */
.box{
  background:rgba(0,0,0,0.7);
  border:1px solid silver;
  box-shadow:0 0 15px rgba(192,192,192,0.3);
  border-radius:14px;
  padding:25px 20px;
  width:90%;
  max-width:400px;
  text-align:center;
}

/* Inputs + buttons */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #aaa;
  font-size:15px;
  background:rgba(255,255,255,0.08);
  color:#fff;
}
input:focus{
  outline:none;
  border-color:silver;
  box-shadow:0 0 8px silver;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(45deg,#555,#aaa);
  color:#fff;
  font-weight:600;
  transition:0.3s;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 12px silver;
}

/* Categories & Tools */
#toolSection{
  width:90%;
  max-width:700px;
  margin:20px auto 100px;
  background:rgba(0,0,0,0.6);
  padding:20px;
  border-radius:14px;
  box-shadow:0 0 20px rgba(192,192,192,0.25);
}
.category{
  background:rgba(255,255,255,0.08);
  padding:14px 18px;
  border-radius:10px;
  margin:10px 0;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.tools{display:none;flex-direction:column;margin-top:8px;}
.tool-item button{
  margin:5px 0;
  background:linear-gradient(45deg,#aaa,#555);
  border:none;
  color:#fff;
  font-weight:500;
  border-radius:8px;
  padding:10px;
  cursor:pointer;
}
.tool-item button:hover{box-shadow:0 0 8px silver;}

/* Onboarding */
.step{
  margin:12px 0;
}
.step.done button{
  background:#2e7d32;
}
.step.done button::after{
  content:" ✔";
  font-weight:bold;
}

/* Modal */
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.95);justify-content:center;align-items:center;
  z-index:2000;}
#modalInner{background:rgba(255,255,255,0.08);padding:20px;border-radius:12px;
  max-width:700px;max-height:80vh;overflow-y:auto;white-space:pre-wrap;}
#copyBtn{position:absolute;top:10px;right:14px;cursor:pointer;font-size:20px;}

/* Loading + Toast */
#loading{display:flex;justify-content:center;align-items:center;height:100vh;
  font-size:18px;font-weight:500;position:absolute;top:0;left:0;width:100%;
  background:rgba(0,0,0,0.9);z-index:3000;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.85);padding:10px 14px;border-radius:8px;display:none;
  z-index:4000;}

/* Footer */
footer{
  width:100%;
  padding:10px;
  background:rgba(0,0,0,0.85);
  text-align:center;
  font-size:12px;
  color:silver;
  border-top:1px solid rgba(192,192,192,0.3);
  position:fixed;
  bottom:0;
  left:0;
  z-index:1000;
}

/* Secret zone */
#secretZone{position:fixed;bottom:10px;left:10px;width:40px;height:40px;
  background:transparent;}
</style>
</head>
<body>
<header>ZT Tools</header>

<div id="loading">⏳ Loading...</div>

<div class="container">
  <!-- Onboarding -->
  <div id="onboarding" class="box">
    <h2 style="color:silver">⚡ Welcome to ZT Tools</h2>
    <div class="step" id="step1">
      <button onclick="completeStep(1,'https://whatsapp.com/channel/0029Vb6HE4S8vd1KJn6XIO17')">Follow WhatsApp Channel</button>
    </div>
    <div class="step" id="step2" style="display:none;">
      <button onclick="completeStep(2,'https://t.me/ziskytechz')">Join Telegram Channel</button>
    </div>
    <div class="step" id="step3" style="display:none;">
      <button onclick="startApp()">🚀 Explore Tools</button>
    </div>
  </div>

  <!-- Login -->
  <div id="loginBox" class="box" style="display:none;">
    <h2>🔑 Enter Access Code</h2>
    <input id="passwordInput" type="password" placeholder="Enter access code...">
    <button id="unlockBtn">🔓 Unlock</button>
  </div>

  <!-- Tools -->
  <div id="toolSection" style="display:none;">
    <h2 style="color:silver">🛠 Categories</h2>
    <div id="categoriesList"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal" onclick="closeModal()">
  <div id="modalInner" onclick="event.stopPropagation()">
    <span id="copyBtn" onclick="copyModalText()">📋</span>
    <div id="modalContent"></div>
  </div>
</div>
<div id="toast"></div>
<div id="secretZone"></div>

<footer>
  <p>Developed by Lord Zisky | All rights reserved 2025</p>
</footer>

<script>
const BIN_ID="68d55a16d0ea881f408aafef";
const API_KEY="$2a$10$8MYvRfmBh5FodfOwEg/.vuPsQKggx5z5oD1QLlRCfRfD6396FnBP.";
const BIN_URL=`https://api.jsonbin.io/v3/b/${BIN_ID}`;
let binData=null,isLoading=true,tapCount=0,tapTimer=null;

async function loadData(){
  try{
    const res=await fetch(BIN_URL,{headers:{"X-Master-Key":API_KEY}});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json=await res.json();
    binData=json.record;
    isLoading=false;
    document.getElementById("loading").style.display="none";

    // Auto skip onboarding if already done
    if(localStorage.getItem("zt_onboardingDone")){
      document.getElementById("onboarding").style.display="none";
      document.getElementById("loginBox").style.display="block";
    }
  }catch(e){
    console.error(e);
    document.getElementById("loading").innerText="❌ Failed to load data";
  }
}
loadData();

function completeStep(step,link){
  window.open(link,"_blank");
  const el=document.getElementById("step"+step);
  el.classList.add("done");
  setTimeout(()=>{
    if(step===1) document.getElementById("step2").style.display="block";
    if(step===2) document.getElementById("step3").style.display="block";
  },2000);
}

function startApp(){
  localStorage.setItem("zt_onboardingDone","true");
  document.getElementById("onboarding").style.display="none";
  document.getElementById("loginBox").style.display="block";
}

document.getElementById("unlockBtn").onclick=()=>{
  if(isLoading){showToast("⏳ Loading...");return;}
  const val=document.getElementById("passwordInput").value.trim();
  if(val===binData.keys.toolkit){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("toolSection").style.display="block";
    renderCategories();
  }else showToast("❌ Invalid access code!");
};

function renderCategories(){
  const c=document.getElementById("categoriesList");c.innerHTML="";
  binData.categories.forEach(cat=>{
    const cd=document.createElement("div");cd.className="category";
    cd.innerHTML=`<span>${cat.name}</span><span>▼</span>`;
    const td=document.createElement("div");td.className="tools";
    cat.tools.forEach(tool=>{
      const div=document.createElement("div");div.className="tool-item";
      const btn=document.createElement("button");btn.textContent=tool.name;
      btn.onclick=(e)=>{
        e.stopPropagation();
        if(tool.link) window.open(tool.link,"_blank");
        else if(tool.content||tool.text) openModal(tool.content||tool.text);
        else openModal("⚠️ No content.");
      };
      div.appendChild(btn);td.appendChild(div);
    });
    cd.onclick=()=>td.style.display=td.style.display==="flex"?"none":"flex";
    c.appendChild(cd);c.appendChild(td);
  });
}

function openModal(t){document.getElementById("modalContent").innerText=t;document.getElementById("modal").style.display="flex";}
function closeModal(){document.getElementById("modal").style.display="none";}
function copyModalText(){navigator.clipboard.writeText(document.getElementById("modalContent").innerText).then(()=>showToast("✅ Copied"));}
function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1500);}
document.getElementById("secretZone").onclick=()=>{tapCount++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>tapCount=0,5000);if(tapCount>=10)location.href="admin.html";};
</script>
</body>
</html>
